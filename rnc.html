<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>College Registration · 20k students</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f6f9fc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 1440px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0b2b4a;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header h1 i {
      color: #2a6df4;
    }

    .dashboard-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: white;
      padding: 0.9rem 1.5rem;
      border-radius: 60px;
      box-shadow: 0 6px 18px rgba(0, 20, 40, 0.06);
      border: 1px solid #e2eaf2;
      align-items: center;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .stat-item i {
      width: 1.8rem;
      height: 1.8rem;
      background: #eef4fe;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #2a6df4;
      font-size: 0.9rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #4a5f7a;
      font-weight: 500;
      white-space: nowrap;
    }

    .stat-value {
      font-weight: 700;
      font-size: 1.2rem;
      color: #0b2b4a;
      margin-right: 0.25rem;
    }

    /* ADD SECTION moved to top */
    .add-section {
      background: white;
      border-radius: 28px;
      margin-bottom: 2rem;
      padding: 1.8rem 2rem;
      border: 1px solid #dee9f3;
      box-shadow: 0 8px 20px rgba(0, 20, 40, 0.04);
    }

    .add-section h2 {
      font-size: 1.3rem;
      color: #0b2b4a;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #2d4e72;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .form-group input, .form-group select {
      padding: 0.8rem 1rem;
      border: 1px solid #cfddee;
      border-radius: 16px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.15s;
      background: white;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #2a6df4;
      box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.1);
    }

    .btn-add {
      background: #0b2b4a;
      border: none;
      border-radius: 40px;
      padding: 0.8rem 1.8rem;
      color: white;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.15s;
      height: fit-content;
    }

    .btn-add:hover {
      background: #1d3f63;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-wrapper {
      flex: 2;
      min-width: 260px;
      display: flex;
      background: white;
      border-radius: 48px;
      border: 1px solid #d9e2ef;
      box-shadow: 0 2px 10px rgba(0, 20, 40, 0.02);
      transition: all 0.2s;
      padding: 0.2rem 0.2rem 0.2rem 1.5rem;
      align-items: center;
    }

    .search-wrapper:focus-within {
      border-color: #2a6df4;
      box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.15);
    }

    .search-wrapper i {
      color: #7b8da0;
      font-size: 1rem;
    }

    .search-wrapper input {
      width: 100%;
      padding: 0.9rem 0.8rem;
      border: none;
      outline: none;
      font-size: 1rem;
      background: transparent;
    }

    .search-wrapper input::placeholder {
      color: #9aabbe;
    }

    .btn {
      background: white;
      border: 1px solid #d0ddeb;
      border-radius: 40px;
      padding: 0.8rem 1.6rem;
      font-weight: 500;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #1e385c;
      white-space: nowrap;
    }

    .btn-primary {
      background: #2a6df4;
      border: 1px solid #2a6df4;
      color: white;
      box-shadow: 0 4px 10px rgba(42, 109, 244, 0.2);
    }

    .btn-primary:hover {
      background: #1c56d0;
      border-color: #1c56d0;
      transform: translateY(-1px);
    }

    .btn-outline:hover {
      background: #f2f7ff;
      border-color: #b8cae0;
    }

    .btn i {
      font-size: 1rem;
    }

    /* LIST SECTION */
    .list-section-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      font-size: 1.15rem;
      font-weight: 600;
      color: #0b2b4a;
    }

    .list-section-title i {
      color: #2a6df4;
    }

    .table-container {
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 35px -8px rgba(0, 20, 40, 0.12);
      border: 1px solid #e4ecf5;
      overflow-x: auto;
      padding: 0.2rem;
      max-height: 60vh;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
      font-size: 0.95rem;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th {
      text-align: left;
      padding: 1.2rem 1rem;
      background: #f9fcff;
      color: #264e7b;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border-bottom: 1px solid #dae5f0;
    }

    td {
      padding: 1rem 1rem;
      border-bottom: 1px solid #edf2f9;
      color: #1d3b5c;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #fafdff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .status-registered {
      background: #e3f7ec;
      color: #0f6e3f;
    }

    .status-will-register {
      background: #fff4e0;
      color: #aa5f00;
    }

    .status-needs-time {
      background: #fee9e7;
      color: #b1382c;
    }

    .register-now-btn {
      background: #2a6df4;
      border: none;
      border-radius: 30px;
      padding: 0.45rem 1.2rem;
      color: white;
      font-weight: 500;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 8px rgba(42, 109, 244, 0.3);
      white-space: nowrap;
    }

    .register-now-btn:hover {
      background: #1a56d0;
      transform: scale(1.02);
    }

    .no-results {
      padding: 3rem;
      text-align: center;
      color: #6c819c;
      font-size: 1.05rem;
    }

    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0b2b4a;
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast-message.show {
      opacity: 1;
    }

    @media (max-width: 700px) {
      body { padding: 1rem 0.7rem; }
      .header h1 { font-size: 1.4rem; }
      .dashboard-stats { width: 100%; justify-content: space-between; padding: 0.8rem 1rem; }
      .stat-value { font-size: 1rem; }
      .stat-label { font-size: 0.7rem; }
      .btn span { display: none; }
      .btn i { margin: 0; }
      .btn { padding: 0.8rem 1.2rem; }
      .add-section { padding: 1.2rem; }
    }

    @media (max-width: 480px) {
      .dashboard-stats { flex-wrap: wrap; border-radius: 24px; }
      .stat-item { flex: 1 0 40%; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1><i class="fas fa-graduation-cap"></i> College Registration</h1>
    <div class="dashboard-stats" id="dashboardStats">
      <div class="stat-item">
        <i class="fas fa-users"></i>
        <span class="stat-label">Total</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-item">
        <i class="fas fa-check-circle"></i>
        <span class="stat-label">Registered</span>
        <span class="stat-value" id="registeredCount">0</span>
      </div>
      <div class="stat-item">
        <i class="fas fa-clock"></i>
        <span class="stat-label">Today</span>
        <span class="stat-value" id="willRegisterCount">0</span>
      </div>
      <div class="stat-item">
        <i class="fas fa-hourglass-half"></i>
        <span class="stat-label">Need time</span>
        <span class="stat-value" id="needsTimeCount">0</span>
      </div>
    </div>
  </div>

  <!-- ========== ADD / UPLOAD STUDENT (NOW ON TOP) ========== -->
  <div class="add-section">
    <h2><i class="fas fa-user-plus" style="color: #2a6df4;"></i> Add / Upload Student</h2>
    <div class="form-grid" id="addForm">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="addName" placeholder="e.g. Aditya Sharma">
      </div>
      <div class="form-group">
        <label>Student ID</label>
        <input type="text" id="addStudentId" placeholder="e.g. STU2050">
      </div>
      <div class="form-group">
        <label>Branch</label>
        <input type="text" id="addBranch" placeholder="CSE / ECE / ME">
      </div>
      <div class="form-group">
        <label>Year</label>
        <input type="text" id="addYear" placeholder="1st / 2nd / 3rd / 4th">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="addStatus">
          <option value="Registered">Registered</option>
          <option value="Will Register Today">Will Register Today</option>
          <option value="Needs More Time">Needs More Time</option>
        </select>
      </div>
      <button class="btn-add" id="addStudentBtn"><i class="fas fa-save"></i> Add Student</button>
    </div>
    <p style="margin-top: 1rem; font-size: 0.8rem; color: #6682a0;"><i class="fas fa-info-circle"></i> Data is stored in Firebase Firestore (rncc-bca17). Newest students appear at the top of the list below.</p>
  </div>

  <!-- ========== SEARCH + EXPORT CONTROLS ========== -->
  <div class="controls">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search by Student ID, Name, or Branch" autocomplete="off">
    </div>
    <div style="display: flex; gap: 0.6rem;">
      <button class="btn btn-outline" id="clearSearchBtn" title="Clear search"><i class="fas fa-times"></i> <span>Clear</span></button>
      <button class="btn btn-primary" id="exportBtn"><i class="fas fa-file-excel"></i> <span>Export to Excel</span></button>
    </div>
  </div>

  <!-- ========== STUDENT LIST (NOW BELOW) ========== -->
  <div class="list-section-title"><i class="fas fa-list-ul"></i> Registered Students</div>
  <div class="table-container">
    <table id="studentTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Student ID</th>
          <th>Branch</th>
          <th>Year</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="noResults" class="no-results" style="display: none;">
      <i class="fas fa-user-slash" style="font-size: 2rem; opacity: 0.5; margin-bottom: 0.8rem; display: block;"></i>
      No student found
    </div>
  </div>
</div>

<div id="toast" class="toast-message">Student added</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBCuVi-hxAIL971yGsuArVJIFLI84SnZBE",
    authDomain: "rncc-bca17.firebaseapp.com",
    projectId: "rncc-bca17",
    storageBucket: "rncc-bca17.firebasestorage.app",
    messagingSenderId: "664858959985",
    appId: "1:664858959985:web:2dc6ddbbb6dc3f36d3fbd0",
    measurementId: "G-EL7SWQXPFR"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let allStudents = [];
  let filteredStudents = [];

  const tableBody = document.getElementById('tableBody');
  const noResultsDiv = document.getElementById('noResults');
  const searchInput = document.getElementById('searchInput');
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  const exportBtn = document.getElementById('exportBtn');
  const totalCountSpan = document.getElementById('totalCount');
  const registeredCountSpan = document.getElementById('registeredCount');
  const willRegisterCountSpan = document.getElementById('willRegisterCount');
  const needsTimeCountSpan = document.getElementById('needsTimeCount');
  const toast = document.getElementById('toast');

  const addName = document.getElementById('addName');
  const addStudentId = document.getElementById('addStudentId');
  const addBranch = document.getElementById('addBranch');
  const addYear = document.getElementById('addYear');
  const addStatus = document.getElementById('addStatus');
  const addStudentBtn = document.getElementById('addStudentBtn');

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.background = isError ? '#b1382c' : '#0b2b4a';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function renderTableAndDashboard() {
    const total = allStudents.length;
    const registered = allStudents.filter(s => s.status === 'Registered').length;
    const willRegister = allStudents.filter(s => s.status === 'Will Register Today').length;
    const needsTime = allStudents.filter(s => s.status === 'Needs More Time').length;

    totalCountSpan.textContent = total.toLocaleString();
    registeredCountSpan.textContent = registered.toLocaleString();
    willRegisterCountSpan.textContent = willRegister.toLocaleString();
    needsTimeCountSpan.textContent = needsTime.toLocaleString();

    const query = searchInput.value.trim().toLowerCase();
    if (query === '') {
      filteredStudents = [...allStudents];
    } else {
      filteredStudents = allStudents.filter(s =>
        s.studentId.toLowerCase().includes(query) ||
        s.name.toLowerCase().includes(query) ||
        s.branch.toLowerCase().includes(query)
      );
    }

    if (filteredStudents.length === 0) {
      tableBody.innerHTML = '';
      noResultsDiv.style.display = 'block';
      if (allStudents.length === 0 && query === '') {
        noResultsDiv.innerHTML = `<i class="fas fa-users-slash" style="font-size: 2rem; opacity: 0.4; margin-bottom: 0.8rem; display: block;"></i> No students added yet. Use the form above to add.`;
      } else {
        noResultsDiv.innerHTML = `<i class="fas fa-user-slash" style="font-size: 2rem; opacity: 0.5; margin-bottom: 0.8rem; display: block;"></i> No student found matching "${escapeHtml(query)}"`;
      }
      return;
    } else {
      noResultsDiv.style.display = 'none';
    }

    let html = '';
    filteredStudents.forEach(student => {
      let badgeClass = '';
      if (student.status === 'Registered') badgeClass = 'status-registered';
      else if (student.status === 'Will Register Today') badgeClass = 'status-will-register';
      else badgeClass = 'status-needs-time';

      const showRegisterBtn = student.status !== 'Registered';
      const registerBtnHtml = showRegisterBtn
        ? `<button class="register-now-btn" data-id="${student.id}" data-studentid="${student.studentId}"><i class="fas fa-pen"></i> Register Now</button>`
        : '';

      html += `
        <tr>
          <td><strong>${escapeHtml(student.name)}</strong></td>
          <td>${escapeHtml(student.studentId)}</td>
          <td>${escapeHtml(student.branch)}</td>
          <td>${escapeHtml(student.year)}</td>
          <td><span class="status-badge ${badgeClass}">${escapeHtml(student.status)}</span></td>
          <td>${registerBtnHtml}</td>
        </tr>
      `;
    });

    tableBody.innerHTML = html;

    document.querySelectorAll('.register-now-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const docId = btn.getAttribute('data-id');
        const studentId = btn.getAttribute('data-studentid');
        if (!docId) return;
        try {
          await db.collection('students').doc(docId).update({ status: 'Registered' });
          const student = allStudents.find(s => s.id === docId);
          if (student) student.status = 'Registered';
          renderTableAndDashboard();
          showToast(`Student ${studentId} marked as Registered ✅`);
        } catch (error) {
          console.error('Error updating status:', error);
          showToast(`Error: ${error.code || error.message}`, true);
        }
      });
    });
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function loadStudents() {
    db.collection('students').orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        allStudents = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          allStudents.push({
            id: doc.id,
            name: data.name || '',
            studentId: data.studentId || '',
            branch: data.branch || '',
            year: data.year || '',
            status: data.status || 'Needs More Time',
            createdAt: data.createdAt || null
          });
        });
        renderTableAndDashboard();
      }, (error) => {
        console.error('Firestore error:', error);
        showToast(`Load error: ${error.code || error.message}`, true);
      });
  }

  async function addStudent() {
    const name = addName.value.trim();
    const studentId = addStudentId.value.trim();
    const branch = addBranch.value.trim();
    const year = addYear.value.trim();
    const status = addStatus.value;

    if (!name || !studentId) {
      showToast('Name and Student ID are required', true);
      return;
    }

    const existing = allStudents.find(s => s.studentId.toLowerCase() === studentId.toLowerCase());
    if (existing) {
      showToast(`Student ID "${studentId}" already exists`, true);
      return;
    }

    try {
      await db.collection('students').add({
        name, studentId, branch, year, status,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      addName.value = '';
      addStudentId.value = '';
      addBranch.value = '';
      addYear.value = '';
      addStatus.value = 'Registered';

      showToast(`Student ${studentId} added successfully`);
    } catch (error) {
      console.error('❌ Firestore error:', error.code, error.message);
      showToast(`Error: ${error.code || error.message}`, true);
    }
  }

  function exportToExcel() {
    if (allStudents.length === 0) {
      showToast('No data to export', true);
      return;
    }

    const exportData = allStudents.map(s => ({
      'Name': s.name,
      'Student ID': s.studentId,
      'Branch': s.branch,
      'Year': s.year,
      'Registration Status': s.status
    }));

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Students');
    XLSX.writeFile(wb, `college_registration_${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('Excel exported successfully');
  }

  searchInput.addEventListener('input', renderTableAndDashboard);

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    renderTableAndDashboard();
    searchInput.focus();
  });

  exportBtn.addEventListener('click', exportToExcel);
  addStudentBtn.addEventListener('click', addStudent);

  document.getElementById('addForm').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addStudent();
    }
  });

  loadStudents();
</script>
</body>
</html>
